<script>
/* ============================================================
   FINARA · js/06b-jatah.js   (baru di 1.5.0)

/* ---------- Fitur lanjutan (Pribadi) ----------
   Mode sederhana hanya menampilkan Pemasukan, Pengeluaran, Transfer.
   Jenis lain (pinjaman, cicilan) dan utang-piutang muncul bila fitur lanjutan
   dinyalakan, atau otomatis bila pengguna sudah punya datanya. */
let LANJUT=false;try{LANJUT=localStorage.getItem('finara.lanjut')==='1'}catch(e){}
const BASIC=['income','expense','transfer'];
const hasAdv=()=>S.tx.some(x=>x.w==='p'&&!BASIC.includes(x.ty)&&!['adjp','adjm'].includes(x.ty))||S.pay.some(p=>p.w==='p'&&p.st!=='void');
const LJ=()=>U()||LANJUT||hasAdv();
const tyOK=(k,cur)=>(!T[k].only||U()||k===cur)&&(LJ()||BASIC.includes(k)||k===cur);

/* ---------- Hitungan jatah harian ----------
   Uang tersedia = total saldo − tagihan − tabungan yang diamankan − cadangan tak terduga.
   Jatah hari ini (A) = (sisa setelah tagihan + pengeluaran harian hari ini) ÷ jumlah hari sampai gajian (hari ini ikut dihitung).
   Sisa jatah (rem)  = A − pengeluaran harian hari ini.
   Pengeluaran harian = jenis "expense" yang bukan hasil transaksi berulang dan bukan pembayaran utang
   (keduanya sudah dihitung lewat tagihan). next = jatah per hari mulai besok bila hari ini tidak belanja lagi. */
function jatah(){
const[f,t]=range('month'),np=dAdd(t,1),td=today(),days=Math.max(1,dd(td,np)),tot=accs().reduce((s,a)=>s+bal(a),0n),B=[];
for(const q of S.rec){if(q.w!==S.active||!q.on||!['expense','loan_prin','loan_int'].includes(q.tpl.ty))continue;let d=q.next,g=0;while(d<np&&g++<12){if(d>=td)B.push({d,a:q.tpl.amt,n:q.tpl.n||'Tagihan berulang'});d=addP(d,q.freq,q.dom)}}
const sisaSampai=(p)=>{const seen=new Set(),paid=(p.paid||[]).reduce((v,z)=>{if(z.tx){if(seen.has(z.tx))return v;seen.add(z.tx);const x=S.tx.find(t=>t.id===z.tx);return x&&x.w===p.w&&x.pay===p.id&&x.st==='ok'&&x.d<np&&x.ty===(p.dir==='recv'?'income':'expense')?v+x.amt:v}return(!z.d||z.d<=td)?v+z.amt:v},0n),left=p.amt-paid;return left>0n?left:0n};
for(const p of S.pay)if(p.w===S.active&&p.st==='ok'&&p.dir!=='recv'&&sisaSampai(p)>0n&&p.due<np)B.push({d:p.due,a:sisaSampai(p),n:'Utang: '+p.who});
// Pengeluaran satu kali yang sudah dijadwalkan sebelum gajian juga harus
// ditahan sekarang, meski saldo rekening baru berubah pada tanggal transaksi.
for(const x of txs())if(x.st==='ok'&&x.d>td&&x.d<np&&['expense','loan_prin','loan_int'].includes(x.ty))B.push({d:x.d,a:x.amt,n:x.n||T[x.ty].l});
B.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
const bt=B.reduce((s,b)=>s+b.a,0n),afterBills=tot-bt;
// Target tabungan berlaku untuk satu periode gajian. Jumlah aktual yang sudah
// disisihkan hanya menjadi pembanding; uang yang dilindungi adalah max(target, aktual).
const cfg=S.jatahCfg||{},period=range('month')[0],saved=cfg.periode===period?(cfg.disisihkan||0n):0n;
const savingsTarget=cfg.tabungan||0n,savingsHold=savingsTarget>saved?savingsTarget:saved,savingsLeft=savingsTarget>saved?savingsTarget-saved:0n;
// Total saldo mencakup semua rekening, termasuk rekening tabungan. Karena itu
// target tabungan penuh dikurangi tepat satu kali; 'sudah disisihkan' hanya
// memisahkan target yang sudah diamankan vs yang masih perlu diamankan.
const afterSavings=afterBills-savingsHold;
const reserve=cfg.cadanganMode==='nominal'?(cfg.cadanganNominal||0n):(afterSavings>0n?afterSavings*BigInt(cfg.cadanganPersen||0)/100n:0n);
const fr=afterSavings-reserve;let out=0n;
for(const x of txs())if(x.st==='ok'&&x.d===td&&x.ty==='expense'&&!x.rec&&!x.pay)out+=x.amt;
const A=(fr+out)/BigInt(days);
return{f,t,np,days,tot,B,bt,afterBills,savingsTarget,savingsHold,saved,savingsLeft,afterSavings,reserve,reserveMode:cfg.cadanganMode||'persen',reservePercent:cfg.cadanganPersen??10,reserveNominal:cfg.cadanganNominal||0n,period,fr,out,A,rem:A-out,per:fr>0n?fr/BigInt(days):0n,next:days>1&&fr>0n?fr/BigInt(days-1):0n}}
// Jalankan fn dengan satu transaksi rekaan ditambahkan sementara (untuk pratinjau dampak).
function simTx(o,fn){const t={id:'_sim',w:S.active,st:'ok',at:Date.now(),c:'',to:'',n:'',...o};S.tx.push(t);try{return fn()}finally{const i=S.tx.indexOf(t);if(i>=0)S.tx.splice(i,1)}}
// Belum ada uang yang tercatat sama sekali: jatah belum bisa dihitung.
const needSetup=()=>!accs().some(a=>a.open>0n)&&!txs().some(x=>x.st==='ok'&&T[x.ty].s>0);
// Tambah tagihan tetap bulanan (aturan berulang). Tagihan yang tanggalnya sudah lewat/hari ini dianggap sudah dibayar bulan ini.
function addBill(n,amt,dom,acc){const cs=cats('out'),c=cs.find(v=>/tagihan/i.test(v.name))||cs[0];if(!c||!acc)return false;const td=today();let nx=td.slice(0,7)+'-'+pad(dom);if(nx<=td)nx=addP(nx,'month',dom);
S.rec.push({id:uid(),w:S.active,tpl:{ty:'expense',a:acc,to:'',c:c.id,amt,n},freq:'month',dom,next:nx,on:true});logA('','tagihan tetap',n+' '+rp(amt));return true}

/* ---------- Umpan balik setelah mencatat (toast) ---------- */
function fbMsg(ty,d){const td=today();if(d>td){const J=jatah(),biaya=['expense','loan_prin','loan_int'].includes(ty);return biaya&&d<J.np?'Tersimpan. Biaya sebelum gajian sudah ditahan dalam jatah; saldo rekening berubah pada '+tglId(d)+'.':'Tersimpan. Transaksi masa depan belum mengubah saldo atau jatah sampai tanggalnya tiba.';}
if(needSetup())return'Tersimpan. Isi saldo awal lewat Beranda (Hitung jatah harian saya) agar jatah harian bisa dihitung.';
const J=jatah();if(ty==='transfer')return'Tersimpan. Total uang tidak berubah, jatah harian aman.';
if(J.fr<0n)return'Tersimpan. Uang belum cukup untuk tagihan sampai gajian (kurang '+rp(-J.fr)+').';
if(ty==='expense'&&d===td)return J.rem<0n?'Tersimpan. Melebihi jatah hari ini '+rp(-J.rem)+(J.days>1?'. Jatah besok jadi '+rp(J.next)+'.':'.'):'Tersimpan. Sisa jatah hari ini '+rp(J.rem)+'.';

return'Tersimpan. Uang tersedia sampai gajian: '+rp(J.fr)+'.'}

/* ---------- Pratinjau dampak di formulir transaksi baru ---------- */
function imp(){const el=$('#imp');if(!el)return;el.innerHTML='';if(FM.id||U())return;
const ty=$('#fty').value,ds=$('#fa').value.replace(/\D/g,''),a=$('#fac').value,to=$('#fto').value,d=$('#fd').value;

const amt=BigInt(ds),ac=S.acc.find(v=>v.id===a);if(!ac)return;const td=today(),L=[];
const ln=(l,x,y)=>L.push(`<div><span>${l}</span><span>${rp(x)} → <span class="${y<0n?'neg':''}">${rp(y)}</span></span></div>`);
const future=d>td,toa=ty==='transfer'?S.acc.find(v=>v.id===to):null,b0=bal(ac),b20=toa?bal(toa):0n,J0=jatah();
const n=simTx({d,ty,a,to:toa?to:'',amt},()=>({j:jatah(),b:bal(ac),b2:toa?bal(toa):0n}));let p='';
if(!future){ln('Saldo '+esc(ac.name),b0,n.b);if(toa)ln('Saldo '+esc(toa.name),b20,n.b2)}else{
ln('Saldo '+esc(ac.name),b0,n.b);if(toa)ln('Saldo '+esc(toa.name),b20,n.b2);
if(ty==='expense'||ty==='loan_prin'||ty==='loan_int')p=n.j.fr!==J0.fr?'Biaya ini sudah ditahan dari uang tersedia karena jatuh sebelum gajian. Saldo rekening baru berubah pada tanggal transaksi.':'Tanggal biaya berada di luar periode sampai gajian; belum mengurangi jatah sekarang.';
else p='Tanggal masa depan: saldo baru berubah pada tanggal transaksi. Pemasukan masa depan tidak dimasukkan ke jatah sebelum benar-benar diterima.';
}
if(ty==='transfer')p='Total uang tidak berubah, jadi jatah harian tidak terpengaruh.';
else if(needSetup())p='Saldo awal belum diisi, jadi hitungan jatah belum bisa ditampilkan. Isi lewat Beranda (Hitung jatah harian saya).';
else{ln('Uang tersedia sampai gajian',J0.fr,n.j.fr);
if(ty==='expense'&&d===td){ln('Sisa jatah hari ini',J0.rem,n.j.rem);if(n.j.rem<0n)p='Melebihi jatah hari ini, sehingga jatah hari-hari berikutnya ikut menyusut.'}
else if(!future&&ty!=='expense')ln('Jatah hari ini',J0.A,n.j.A)}
el.innerHTML='<b>Dampak jika disimpan</b>'+L.join('')+(p?'<p>'+p+'</p>':'')}

/* ---------- Beranda perorangan ---------- */
function heroJ(J){const ng=J.fr<0n,ov=!ng&&J.rem<0n,pc0=J.A>0n?Math.min(100,Math.max(0,Number(J.out*100n/J.A))):(J.out>0n?100:0);
const lab=ng?'Uang belum cukup sampai gajian':ov?'Melebihi alokasi hari ini':'Estimasi alokasi hari ini',big=ng?'Kurang '+rp(-J.fr):rp(J.rem);
const sub=ng?'Saldo '+rp(J.tot)+', tagihan '+rp(J.bt)+', tabungan dan cadangan '+rp(J.tot-J.bt-J.fr)+'. Periksa saldo dan pengaturan jatah.'
:ov?(J.days>1?'Jatah hari-hari berikutnya menyusut jadi '+rp(J.next)+' per hari.':'Besok sudah gajian.')
:S.tx.length?'Dari jatah '+rp(J.A)+' hari ini, terpakai '+rp(J.out)+'.':'Catat pengeluaran pertama Anda, dan angka ini langsung berubah.';
return`<div class="hero hj${ng||ov?' bad':''}"><small>${lab}</small><b>${big}</b>${ng?'':`<div class="hbar" role="img" aria-label="Jatah hari ini terpakai ${pc0}%"><i style="width:${pc0}%"></i></div>`}<small class="hsub">${sub}</small>
<div class="hmini"><span><em>Total saldo</em><strong>${rp(J.tot)}</strong></span><span><em>Tagihan</em><strong>−${rp(J.bt)}</strong></span><span><em>Siap digunakan</em><strong>${rp(J.fr)}</strong></span></div>
<small>Estimasi rata-rata setelah tagihan, tabungan, dan cadangan yang Anda atur; bukan batas aman mutlak. Dibagi ${J.days} hari sampai gajian ${tglId(J.np)}. <button class="lk" data-a="payday">Ubah tanggal gajian</button></small>
<div class="qa"><button class="btn" data-a="add:expense"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Catat</button><button class="btn ghost" data-a="add:transfer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4"/></svg>Transfer</button></div></div>`}
// Layar pertama untuk pengguna yang belum punya uang tercatat: janji, contoh hitungan, tiga pertanyaan.
function vWelcome(){return`<div class="dash"><div class="hero hj prom"><small>Selamat datang di Finara</small><b>Perkirakan alokasi rata-rata harian dari saldo dan tagihan sampai gajian.</b><small>Jawab 3 pertanyaan singkat. Hasilnya langsung tampil, sebelum Anda mencatat apa pun.</small><div class="qa"><button class="btn" data-a="onb">Hitung jatah harian saya</button></div></div>

<div class="c"><b>Tiga pertanyaan yang akan diajukan</b><ol class="qs"><li>Uang Anda sekarang berapa?</li><li>Gajian tanggal berapa?</li><li>Tagihan tetap tiap bulan apa saja? (boleh dilewati)</li></ol><small>Setelah itu, setiap Anda mencatat pengeluaran, Beranda langsung menunjukkan sisa jatah hari ini. Data hanya tersimpan di perangkat Anda.</small><div class="row"><button class="btn ghost" data-a="demo">Coba dulu dengan data contoh</button></div></div></div></div>`}

/* ---------- Kartu cara hitung ---------- */
function plancard(J,r){const ms=mon(6).slice(2,5),
an=Object.entries(r.cat).map(([c,v])=>[c,v,ms.reduce((s,m)=>s+(sum(m.f,m.t).cat[c]||0n),0n)/3n]).filter(([c,v,av])=>av>0n&&v>av*3n/2n).sort((a,b)=>{const da=a[1]-a[2],db=b[1]-b[2];return db>da?1:db<da?-1:0}).slice(0,3);

+hr('Sisa setelah tagihan',rp(J.afterBills),'sebelum tabungan dan cadangan')

const ratio10=(n,d,scale)=>{if(d<=0n)return null;const neg=n<0n,a=neg?-n:n,q=(a*scale+d/2n)/d;return neg?-q:q};
const fmt10=v=>{if(v===null)return'–';const a=v<0n?-v:v;return(v<0n?'−':'')+(a/10n)+'.'+(a%10n)};

const ins=txs().filter(x=>x.st==='ok'&&x.d>=f&&x.d<=t&&(x.ty==='loan_prin'||x.ty==='loan_int')).reduce((s,x)=>s+x.amt,0n),dr10=r.inc>0n?ratio10(ins,r.inc,1000n):null;
// Sisa arus kas setelah beban dan pembayaran pokok, bukan sekadar pendapatan dikurangi beban.
const sv10=r.inc>0n?ratio10(r.inc-r.exp-r.lpr,r.inc,1000n):null;
const allCash=cashFor('p')+cashFor('u'),allReceivable=payFor('p','recv')+payFor('u','recv'),allPayable=payFor('p','pay')+payFor('u','pay'),allLoan=loanFor('p')+loanFor('u'),al=allCash+allReceivable-allPayable-allLoan;

const need=av*3n-runwayCash;
const gNw=nw<0n?'Kewajiban tercatat lebih besar daripada saldo dan piutang. Periksa juga apakah pinjaman yang sama dicatat di transaksi dan daftar utang-piutang.':'',
gEm=em10===null?'Catat pengeluaran dan pembayaran cicilan selama beberapa hari agar daya tahan kas bisa diperkirakan.':em10<30n&&need>0n?'Kas non-pinjaman tercatat belum mencapai 3 bulan pengeluaran dan pembayaran pokok rata-rata. Utang-piutang yang dicatat terpisah belum dikurangkan.':'',
gSv=sv10===null?'':sv10<100n?'Sisa arus kas setelah pengeluaran dan pokok pinjaman masih di bawah 10% pemasukan. Tinjau pengeluaran dan cicilan.':sv10<200n?'Naikkan sisa arus kas menuju 20% bila memungkinkan.':'',
gDr=dr10!==null&&dr10>300n?'Pembayaran pokok dan bunga yang tercatat mencapai '+fmt10(dr10)+'% pemasukan. Angka ini tidak mencakup cicilan yang belum dicatat.':'';

const row=(l,v,s,c,h,g)=>`<div class="hr"><div><b>${l}</b><small>${h}</small>${g?`<small class="sg">Langkah: ${g}</small>`:''}</div><div><b class="${c}">${v}</b><small>${s}</small></div></div>`;
return`<div class="c health"><h3>Kesehatan keuangan</h3><small>Setiap angka disertai langkah yang bisa Anda lakukan bila perlu.</small>`+row('Kekayaan bersih (estimasi)',rp(nw),'saldo + piutang − utang − pinjaman tercatat',nw<0n?'neg':'pos','Saldo dan piutang dikurangi utang-piutang serta sisa pinjaman dari transaksi Pinjaman diterima dikurangi Bayar pokok. Jika pinjaman yang sama dicatat di kedua tempat, hasil dapat terhitung ganda.',gNw)

+row('Sisa arus kas',sv10===null?'–':fmt10(sv10)+'%',sv10===null?'belum ada pemasukan':sv10>=200n?'baik':sv10>=100n?'cukup':'rendah',sv10===null?'':sv10>=100n?'pos':'neg','Pemasukan dikurangi pengeluaran tercatat dan pembayaran pokok pinjaman, dibanding pemasukan. Rasio dibulatkan satu angka desimal. Tidak sama dengan kenaikan tabungan bersih karena transfer, modal, dan penarikan tidak dihitung.',gSv)
+row('Pembayaran cicilan tercatat',dr10===null?'–':fmt10(dr10)+'%',dr10===null?'belum ada pemasukan':dr10<=300n?'sehat':dr10<=400n?'waspada':'tinggi',dr10===null?'':dr10<=300n?'pos':'neg','Pembayaran pokok dan bunga yang sudah dicatat pada periode ini dibanding pemasukan. Tidak mengukur seluruh cicilan terjadwal atau kewajiban yang belum dicatat. Rasio dibulatkan satu angka desimal.',gDr)

let fut=0;for(const x of all){if(x.st!=='ok'){vd++;continue}if(x.d>today()){fut++;continue}let k,d;if(x.ty==='transfer'){k=x.a===id?'tout':'tin';d=x.a===id?-x.amt:x.amt}else{k=x.ty;d=eff(x)}const r=g[k]=g[k]||{n:0,t:0n};r.n++;r.t+=d}
const O=['income','tin','capital','loan_in','refund','adjp','expense','tout','draw','loan_prin','loan_int','adjm'],lb=k=>k==='tin'?'Transfer masuk':k==='tout'?'Transfer keluar':T[k].l;
const rows=Object.keys(g).sort((x,y)=>O.indexOf(x)-O.indexOf(y)).map(k=>`<tr><td>${lb(k)}<small>${g[k].n} transaksi</small></td><td class="${g[k].t<0n?'neg':'pos'}">${g[k].t>0n?'+':''}${rp(g[k].t)}</td></tr>`).join('');
sheet(`<h2>${esc(a.name)}</h2><small>Rincian saldo rekening</small><div class="c"><table><tr><td>Saldo awal<small>${a.src&&a.src.length?'Terdiri dari '+a.src.length+' sumber':a.note?esc(a.note):'Uang yang sudah ada sebelum mulai mencatat'}</small></td><td>${rp(a.open)}</td></tr>${(a.src||[]).map(v=>`<tr class="sub"><td>${esc(v.n)}</td><td>${rp(v.amt)}</td></tr>`).join('')}${rows}<tr><td><b>Saldo sekarang</b></td><td>${rp(bal(a))}</td></tr></table><small class="hint">Saldo sekarang = saldo awal ditambah semua transaksi sah di rekening ini.${vd?' '+vd+' transaksi dibatalkan tidak dihitung.':''}${fut?' '+fut+' transaksi bertanggal masa depan belum dihitung sampai tanggalnya tiba.':''} Saldo awal dicatat sebagai ekuitas awal, bukan pendapatan.</small></div><h3>Transaksi terbaru rekening ini</h3>${list(all.sort(cmp).slice(0,10))}<div class="row">${U()?'':`<button class="btn" data-a="reconcile:${a.id}">Rekonsiliasi saldo sekarang</button>`}<button class="btn ghost" data-a="accnew:${a.id}">${U()?'Ubah nama dan saldo awal':'Ubah nama / saldo awal'}</button><button class="btn ghost" data-a="close">Tutup</button></div>`)},
srcadd(){const id=uid(),b=$('#srcs');b.insertAdjacentHTML('beforeend','<div class="srow" id="r'+id+'"><input class="sn" maxlength="40" placeholder="Nama sumber, mis. Tabungan" aria-label="Nama sumber"><div><input class="sa" inputmode="numeric" placeholder="0" aria-label="Jumlah sumber"></div><button class="sx" data-a="srcdel:'+id+'" aria-label="Hapus sumber">×</button></div>');fmtInit();srcsum();b.lastElementChild.querySelector('.sn').focus()},

accnew(p){const a=p?S.acc.find(v=>v.id===p):null;FM.acc=a?a.id:'';sheet(`<h2>${a?'Ubah':'Tambah'} rekening</h2><label>Nama<input id="an" maxlength="40" value="${esc(a?a.name:'')}"></label><label>Saldo awal (Rp)<input id="ao" inputmode="numeric" placeholder="0" value="${a&&a.open?a.open:''}"></label><h3>Rincian sumber saldo awal (opsional)</h3><small>Isi per sumber, misalnya tabungan atau deposito. Saldo awal di atas dihitung otomatis dari jumlahnya.</small><div id="srcs"></div><div class="row"><button class="btn ghost" data-a="srcadd">Tambah sumber</button></div><small class="hint">${U()?'Saldo awal adalah uang sebelum pencatatan dimulai. Mengubahnya akan mengubah saldo awal seluruh laporan historis. Untuk menyamakan saldo rekening saat ini dengan saldo nyata, gunakan Rekonsiliasi saldo di rincian rekening.':'Saldo awal adalah uang yang sudah ada sebelum mulai mencatat. Ini dicatat sebagai ekuitas awal, bukan pendapatan.'}</small><p id="err" class="neg"></p><div class="row"><button class="btn" data-a="accsave">Simpan</button><button class="btn ghost" data-a="close">Tutup</button></div>`);if(a&&a.src&&a.src.length){for(const v of a.src){act.srcadd();const r=$('#srcs').lastElementChild;r.querySelector('.sn').value=v.n;r.querySelector('.sa').value=v.amt;fmtNum(r.querySelector('.sa'))}srcsum()}},
accsave(){const n=$('#an').value.trim(),ds=$('#ao').value.replace(/\D/g,''),o=NB(ds);
if(!n||o<0n){$('#err').textContent=!n?'Isi nama rekening.':'Saldo awal terlalu besar.';return}
const sr=[...document.querySelectorAll('#shc .srow')].map(r=>({n:r.querySelector('.sn').value.trim(),amt:NB(r.querySelector('.sa').value.replace(/\D/g,''))})).filter(v=>v.amt!==0n);if(sr.some(v=>v.amt<0n)){$('#err').textContent='Jumlah sumber terlalu besar.';return}if(sr.some(v=>!v.n)){$('#err').textContent='Isi nama untuk setiap sumber.';return}const op=sr.length?sr.reduce((t,v)=>t+v.amt,0n):o;if(op.toString().length>MAXD){$('#err').textContent='Saldo awal terlalu besar.';return}const ex=FM.acc&&S.acc.find(v=>v.id===FM.acc);if(ex){logA(ex.id,'ubah rekening',ex.name+' saldo awal '+rp(ex.open)+' → '+rp(op));ex.name=n;ex.open=op;ex.src=sr;delete ex.note}else S.acc.push({id:uid(),w:S.active,name:n,open:op,src:sr});FM.acc='';save();close();render();toast('Rekening tersimpan')},

catedit(id){const c=S.cat.find(v=>v.id===id);if(!c)return;FM.cat=id;sheet(`<h2>Ubah kategori</h2><small>${c.k==='in'?'Pendapatan':'Pengeluaran'} · ${catUse(id)} transaksi</small><label>Nama<input id="cn" maxlength="40" value="${esc(c.name)}"></label><p id="err" class="neg"></p><div class="row"><button class="btn" data-a="catren">Simpan nama</button><button class="btn ghost" data-a="catdel:${id}">Hapus kategori</button><button class="btn ghost" data-a="catmgr">Kembali</button></div>`)},

bk(){sheet(`<h2>Cadangan dan pemulihan</h2><small class="hint">Privasi penuh: data hanya ada di perangkat Anda. Finara tidak punya server dan tidak mengirim apa pun ke internet. Cadangan adalah file yang Anda simpan sendiri (File Manager Android, aplikasi Files di iPhone, atau penyimpanan pribadi Anda).</small><h3>Simpan cadangan</h3><div class="row"><button class="btn" data-a="bkdl">Unduh cadangan lengkap (.json)</button><button class="btn ghost" data-a="bkcsv">Unduh cadangan spreadsheet (.csv)</button></div><small>File .csv bisa dibuka di Excel atau Google Sheets dan dipulihkan lagi ke Finara. Isinya rekening, kategori, anggaran, dan transaksi. Utang-piutang, transaksi berulang, dan target tabungan hanya ada di file .json.</small><h3>Pulihkan dari file</h3><label>Pilih file cadangan (.json atau .csv)<input type="file" id="bkf" accept=".json,.csv,application/json,text/csv"></label><details><summary>Tempel teks cadangan (lanjutan)</summary><textarea id="rs" placeholder="Tempel teks cadangan JSON"></textarea><div class="row"><button class="btn ghost" data-a="rest">Pulihkan dari teks</button></div></details><div class="row"><button class="btn ghost" data-a="close">Tutup</button></div>`)},

help(){sheet(`<h2>Petunjuk penggunaan</h2><h3>Jatah harian</h3><p>Di Beranda, Finara memperkirakan alokasi rata-rata harian sampai gajian. Cara hitungnya: total saldo seluruh rekening dikurangi tagihan, target tabungan periode ini, dan cadangan tak terduga, lalu dibagi jumlah hari sampai gajian. Pengaturan tabungan dan cadangan ada di tombol Ubah tanggal gajian pada kartu jatah. Pastikan total saldo mencakup rekening tabungan/cadangan; target tabungan dikurangi satu kali dari total saldo. Nilai sudah disisihkan hanya memisahkan bagian target yang sudah diamankan dari yang masih perlu diamankan. Setiap kali Anda mencatat pengeluaran, sisa jatah hari ini langsung berkurang. Bila lewat dari jatah, jatah hari-hari berikutnya menyusut. Untuk menghitungnya Finara butuh tiga hal: uang Anda sekarang, tanggal gajian, dan tagihan tetap (Lainnya, Tagihan tetap dan transaksi berulang).</p><h3>Agar data selalu tersimpan</h3><p>Data disimpan di peramban perangkat ini, bukan di server. Buka selalu lewat tautan dan peramban yang sama, jangan pakai tab penyamaran (incognito/private), dan jangan hapus data situs atau riwayat peramban.</p><h3>Android (Chrome)</h3><p>Ketuk menu ⋮, pilih Tambahkan ke layar utama (atau Instal aplikasi), lalu buka Finara dari ikon tersebut.</p><h3>iPhone (Safari)</h3><p>Buka tautan di Safari, ketuk Bagikan, pilih Tambah ke Layar Utama, lalu pakai dari ikon itu sejak awal. Data di tab Safari tidak otomatis ada di ikon, dan data situs yang lama tidak dibuka bisa dihapus iOS.</p><h3>Cadangan rutin</h3><p>Buka Lainnya, Cadangan dan pulihkan, lalu ketuk Unduh cadangan lengkap (.json). Simpan file itu di tempat aman di luar aplikasi (penyimpanan HP, Google Drive, atau email ke diri sendiri). Lakukan seminggu sekali. Cadangan tidak dienkripsi, jadi simpan di tempat yang hanya Anda yang bisa buka.</p><h3>Memulihkan data</h3><p>Buka Cadangan dan pulihkan, ketuk Pilih file cadangan di bagian Pulihkan dari file (.json atau .csv), lalu ketuk Ya, pulihkan pada konfirmasi. Semua data saat ini akan diganti. File .csv hanya memuat rekening, kategori, anggaran, dan transaksi. Jika file tidak bisa dipilih, buka Tempel teks cadangan (lanjutan) dan tempel isi file .json di sana.</p><h3>Mengisi atau mengubah saldo awal</h3><p>Pertama kali, ketuk Hitung jatah harian saya di Beranda dan isi uang tunai serta saldo bank atau e-wallet. ${U()?'Untuk mengubah nama dan saldo awal, buka tab Rekening, ketuk rekening, lalu pilih Ubah nama dan saldo awal.':'Untuk mengubah saldo awal historis, buka tab Rekening, ketuk rekening, lalu pilih Ubah nama / saldo awal. Perubahan saldo awal memengaruhi laporan historis. Untuk mencocokkan saldo rekening saat ini, pilih Rekonsiliasi saldo sekarang agar selisih dicatat sebagai koreksi, bukan pendapatan atau pengeluaran.'} Untuk rekening baru, pakai Tambah rekening.</p><h3>Tips mencatat</h3><p>Ketuk Catat. Pilih Pengeluaran, Pemasukan, atau Transfer; di bawah nominal Anda melihat dampaknya ke saldo dan jatah sebelum menyimpan. Pindah dana antar rekening pakai Transfer, bukan pengeluaran. Jenis lain seperti pinjaman dan cicilan ada di fitur lanjutan (Lainnya). Transaksi yang salah bisa dibatalkan dan tetap tercatat sebagai batal.</p><h3>Tombol Bantuan</h3><p>Tombol ? (di kanan atas, dan di pojok kanan atas setiap jendela form) menampilkan atau menyembunyikan semua catatan penjelasan. Ketuk satu catatan untuk melipatnya jadi satu baris, ketuk lagi untuk membukanya. Pilihan tombol dan catatan yang dilipat diingat di perangkat Anda.</p><h3>Prinsip aplikasi</h3><p>Saldo tidak disimpan sebagai satu angka. Ia dihitung ulang dari saldo awal ditambah semua transaksi sah, jadi selalu bisa diperiksa. Pencatatan memakai basis kas: pendapatan dan beban dihitung saat uang bergerak. Transaksi batal tidak dihapus, hanya tidak dihitung. Ruang kerja Pribadi dan Usaha terpisah penuh. Laporan memakai tanggal transaksi. Bagi yang paham akuntansi, setiap transaksi dibentuk menjadi jurnal debit-kredit yang bisa dilihat di Lainnya, Debit-kredit dan neraca.</p><div class="row"><button class="btn" data-a="close">Tutup</button></div>`)},
rec(){const a=S.rec.filter(r=>r.w===S.active),F={week:'mingguan',month:'bulanan',year:'tahunan'};sheet('<h2>'+(U()?'Transaksi berulang':'Tagihan tetap dan transaksi berulang')+'</h2>'+(U()?'':'<small class="hint">Tagihan tetap (kos, cicilan, listrik) disisihkan dulu dari uang Anda sebelum jatah harian dihitung. Finara mencatatnya otomatis pada tanggal jatuh tempo, jadi aturan ini mengasumsikan tagihan dibayar saat itu. Jika belum dibayar, jeda aturan dan catat kewajibannya agar saldo tidak dianggap sudah keluar.</small>')+(a.length?a.map(r=>`<div class="c"><b>${esc(T[r.tpl.ty].l)} ${rp(r.tpl.amt)}</b><small>${F[r.freq]} · berikutnya ${fd(r.next)} · ${esc(nm(S.acc,r.tpl.a))}${r.on?'':' · dijeda'}</small><div class="row"><button class="btn ghost" data-a="rtog:${r.id}">${r.on?'Jeda':'Aktifkan'}</button><button class="btn ghost" data-a="rdel:${r.id}">Hapus aturan</button></div></div>`).join(''):'<div class="empty">Belum ada. Saat mencatat transaksi baru, pilih Ulangi.</div>')+'<div class="row">'+(U()?'':'<button class="btn" data-a="billnew">Tambah tagihan tetap</button>')+'<button class="btn ghost" data-a="close">Tutup</button></div><small>Transaksi dicatat otomatis saat aplikasi dibuka, termasuk yang terlewat.</small>')},
rtog(p){const r=S.rec.find(v=>v.id===p);r.on=!r.on;save();act.rec();render()},
rdel(p){S.rec=S.rec.filter(v=>v.id!==p);save();act.rec();render()},
plist(){const a=S.pay.filter(p=>p.w===S.active&&p.st!=='void').sort((x,y)=>x.due.localeCompare(y.due)),sm=d=>a.filter(p=>p.dir===d).reduce((s,p)=>s+sisa(p),0n);
sheet(`<h2>Utang-piutang</h2><div class="c g2"><div><small>Piutang (hak tagih)</small><b class="pos">${rp(sm('recv'))}</b></div><div><small>Utang (kewajiban)</small><b class="neg">${rp(sm('pay'))}</b></div></div>`+(a.length?a.map(p=>{const r=sisa(p);return`<button class="tx" data-a="pdet:${p.id}"><i class="av ${p.dir==='recv'?'pos':'neg'}">${p.dir==='recv'?'↓':'↑'}</i><span class="gr">${esc(p.who)}<small>Jatuh tempo ${fd(p.due)}${r>0n&&p.due<today()?' · terlambat':''}${r===0n?' · lunas':''}</small></span><span>${rp(r)}</span></button>`}).join(''):'<div class="empty">Belum ada catatan.</div>')+'<div class="row"><button class="btn" data-a="pnew">Tambah</button><button class="btn ghost" data-a="close">Tutup</button></div><small>Pembayaran bisa langsung dicatat ke rekening: piutang menjadi pendapatan, utang menjadi pengeluaran. Untuk pinjaman uang, pilih Tanpa transaksi rekening lalu catat dengan jenis Pinjaman diterima atau Bayar pokok pinjaman.</small>')},
pnew(){sheet(`<h2>Catatan baru</h2><label>Jenis<select id="pd"><option value="recv">Piutang (orang lain berutang ke saya)</option><option value="pay">Utang (saya berutang)</option></select></label><label>Nama pihak<input id="pw" maxlength="60"></label><label>Nominal (Rp)<input id="pa" inputmode="numeric"></label><label>Jatuh tempo<input type="date" id="pu" value="${today()}"></label><label>Catatan<input id="pn" maxlength="120"></label><p id="err" class="neg"></p><div class="row"><button class="btn" data-a="psave">Simpan</button><button class="btn ghost" data-a="plist">Kembali</button></div>`)},
psave(){const w=$('#pw').value.trim(),ds=$('#pa').value.replace(/\D/g,''),amt=NB(ds),u=$('#pu').value;const m=!w?'Isi nama pihak.':amt<0n?'Nominal terlalu besar.':!amt?'Nominal harus lebih dari 0.':!/^\d{4}-\d{2}-\d{2}$/.test(u)||ymd(new Date(u+'T00:00:00'))!==u?'Tanggal jatuh tempo tidak valid.':'';if(m){$('#err').textContent=m;return}
const p={id:uid(),w:S.active,dir:$('#pd').value,who:w,amt,due:u,n:$('#pn').value.trim(),paid:[],st:'ok',at:Date.now()};S.pay.push(p);logA(p.id,'buat',(p.dir==='recv'?'Piutang ':'Utang ')+rp(amt)+' '+w);save();act.plist();render()},
pdet(p){const x=S.pay.find(v=>v.id===p);FM.p=p;const r=sisa(x);sheet(`<h2>${esc(x.who)}</h2><small>${x.dir==='recv'?'Piutang':'Utang'} · jatuh tempo ${fd(x.due)}${x.n?' · '+esc(x.n):''}</small><div class="c"><table><tr><td>Total</td><td>${rp(x.amt)}</td></tr>${x.paid.map(v=>`<tr><td>Dibayar ${fd(v.d)}${v.tx?' · ke rekening':''}${v.tx&&!pa(v,x)?' · transaksi tidak dihitung':''}</td><td>${rp(pa(v,x))}</td></tr>`).join('')}<tr><td><b>Sisa</b></td><td>${rp(r)}</td></tr></table></div>${r>0n?`<label>Catat pembayaran (Rp)<input id="pp" inputmode="numeric" value="${r}"></label><label>Catat ke rekening<select id="pac"><option value="">Tanpa transaksi rekening</option>${accs().map(a=>opt(a.id,a.name,accs()[0].id)).join('')}</select></label><label>Kategori<select id="pcat">${cats(x.dir==='recv'?'in':'out').map(c=>opt(c.id,c.name)).join('')}</select></label><small class="hint">${x.dir==='recv'?'Uang masuk ke rekening dan dicatat sebagai pendapatan.':'Uang keluar dari rekening dan dicatat sebagai pengeluaran.'} Pilih Tanpa transaksi rekening jika uangnya sudah Anda catat sendiri atau berupa pinjaman uang.</small><p id="err" class="neg"></p><div class="row"><button class="btn" data-a="ppay">Catat pembayaran</button>`:'<div class="row">'}<button class="btn ghost" data-a="pvoid">Batalkan catatan</button><button class="btn ghost" data-a="plist">Kembali</button></div>`)},
ppay(){const x=S.pay.find(v=>v.id===FM.p),ds=$('#pp').value.replace(/\D/g,''),a=NB(ds);if(a<=0n||a>sisa(x)){$('#err').textContent='Nominal harus lebih dari 0 dan tidak melebihi sisa.';return}const ac=$('#pac').value,ct=$('#pcat').value;if(ac&&!ct){$('#err').textContent='Pilih kategori.';return}const pm={d:today(),amt:a};if(ac){const t={id:uid(),w:S.active,st:'ok',at:Date.now(),d:today(),ty:x.dir==='recv'?'income':'expense',a:ac,to:'',c:ct,amt:a,n:(x.dir==='recv'?'Terima piutang ':'Bayar utang ')+x.who,pay:x.id};S.tx.push(t);logA(t.id,'buat',desc(t));pm.tx=t.id}x.paid.push(pm);logA(x.id,'bayar',rp(a));save();act.pdet(x.id);render()},
pvoid(){ask('Batalkan catatan ini? Transaksi rekening yang dibuat dari pembayarannya ikut dibatalkan.','pvoid2','','Ya, batalkan')},
pvoid2(){const x=S.pay.find(v=>v.id===FM.p);x.st='void';for(const v of x.paid){const t=v.tx&&S.tx.find(q=>q.id===v.tx);if(t&&t.st==='ok'){t.st='void';logA(t.id,'batal',desc(t))}}logA(x.id,'batal',x.who);save();act.plist();render()},
jurnal(){const L=ledger(),k=Object.keys(L).sort(),net=a=>L[a][0]-L[a][1],g=p=>k.filter(a=>a[0]===p).reduce((s,a)=>s+net(a),0n);let D=0n,C=0n;
const rows=k.map(a=>{const n=net(a),d=n>0n?n:0n,c=n<0n?-n:0n;D+=d;C+=c;return`<tr><td>${esc(lname(a))}</td><td>${d?rp(d):''}</td><td>${c?rp(c):''}</td></tr>`}).join(''),as=g('A'),li=-g('L'),eq=-(g('E')+g('R')+g('B')),ok=D===C&&as===li+eq;
sheet(`<h2>Debit-kredit dan neraca</h2><small class="hint">Setiap transaksi punya dua sisi, debit dan kredit, dengan nilai sama. Aset seperti rekening normalnya di debit, sedangkan pendapatan, modal, dan kewajiban normalnya di kredit. Jurnal dibentuk otomatis dari saldo awal dan setiap transaksi sah.</small><div class="c"><table><tr><td><b>Akun</b></td><td><b>Debit</b></td><td><b>Kredit</b></td></tr>${rows}<tr><td><b>Total</b></td><td>${rp(D)}</td><td>${rp(C)}</td></tr></table><p class="${ok?'pos':'neg'}">${ok?'Seimbang: total debit sama dengan total kredit.':'Tidak seimbang. Periksa data atau buat cadangan.'}</p></div><h3>Neraca ringkas</h3><div class="c"><table><tr><td>Aset (rekening)</td><td>${rp(as)}</td></tr><tr><td>Kewajiban (pinjaman)</td><td>${rp(li)}</td></tr><tr><td>Ekuitas</td><td>${rp(eq)}</td></tr></table></div><div class="row"><button class="btn ghost" data-a="close">Tutup</button></div>`)},
log(){const a=S.log.slice(-60).reverse();sheet('<h2>Riwayat perubahan</h2>'+(a.length?'<div class="lst">'+a.map(v=>`<div class="tx"><span class="gr">${esc(v.act)}<small>${new Date(v.t).toLocaleString('id-ID')} · ${esc(v.b)}</small></span></div>`).join('')+'</div>':'<div class="empty">Belum ada riwayat.</div>')+'<div class="row"><button class="btn ghost" data-a="close">Tutup</button></div>')},
ver(){sheet('<h2>Riwayat versi</h2>'+RIWAYAT.map(r=>'<div class="rv"><b>v'+esc(r.v)+'</b><small>'+esc(tglId(r.t))+'</small>'+r.u.map(x=>'<p>• '+esc(x)+'</p>').join('')+'</div>').join('')+'<div class="row"><button class="btn" data-a="close">Tutup</button></div>')},
info(){sheet(`<h2>Tentang dan keterbatasan</h2><p><b>Finara</b> v${VER} · diperbarui ${tglId(TGL)} · Made by <b>Herysap61</b></p><p>Data tersimpan di peramban perangkat ini dan berjalan tanpa internet. Agar bisa dibuka saat offline, buka sekali lewat tautan web (https) bersama file sw.js; setelah itu salinan aplikasi tersimpan di perangkat. Jika file HTML dibuka langsung dari penyimpanan, fitur offline ini tidak aktif. Di iPhone, tambahkan ke Layar Utama agar penyimpanan lebih awet; buat cadangan rutin.</p><p>Belum tersedia: kunci PIN/biometrik, enkripsi cadangan, dan notifikasi pengingat. Transaksi berulang dicatat otomatis saat aplikasi dibuka, jurnal debit-kredit dibentuk otomatis dari transaksi, dan data lama dimigrasi otomatis ke skema terbaru. Saldo dihitung ulang dari saldo awal dan transaksi sah setiap kali ditampilkan. Nominal memakai bilangan bulat presisi penuh hingga 36 digit (sampai 999 desiliun), sehingga tidak ada pembulatan.</p><div class="row"><button class="btn ghost" data-a="ver">Riwayat versi</button><button class="btn" data-a="close">Tutup</button></div>`)}};

</script>
<script>
/* ============================================================
   FINARA · js/09b-aksi-jatah.js   (baru di 1.5.0)
   AKSI JATAH HARIAN: alur tiga pertanyaan (onb*), tagihan tetap (bill*),
   penanda fitur lanjutan (lanjut). Menambah aksi ke objek `act` dari
   09-aksi.js lewat Object.assign; tidak menimpa aksi yang sudah ada.
   Logika hitungan ada di 06b-jatah.js.
   ============================================================ */
// Jawaban sementara selama alur tiga pertanyaan (disimpan sebagai teks angka).
let ONB={s:1,cash:'',bank:'',pd:'',bills:[]};
const onbHead=n=>`<div class="stp" role="img" aria-label="Langkah ${n} dari 3">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}<small>Langkah ${n} dari 3</small></div>`;
const brow=(n,a,d)=>{const id=uid();return`<div class="brow" id="b${id}"><input class="bnm" maxlength="40" placeholder="Nama tagihan, mis. Kos" aria-label="Nama tagihan" value="${esc(n)}"><div><input class="ba" inputmode="numeric" placeholder="0" aria-label="Nominal tagihan" value="${esc(a)}"></div><input class="bdy" inputmode="numeric" data-plain maxlength="2" placeholder="Tgl" aria-label="Tanggal jatuh tempo, 1 sampai 28" value="${esc(d)}"><button class="sx" data-a="onbrowdel:${id}" aria-label="Hapus tagihan">×</button></div>`};
const readBills=()=>[...document.querySelectorAll('#bls .brow')].map(r=>({n:r.querySelector('.bnm').value.trim(),a:r.querySelector('.ba').value.replace(/\D/g,''),d:r.querySelector('.bdy').value.trim()}));
Object.assign(act,{
onb(){ONB={s:1,cash:'',bank:'',pd:'',bills:[]};act.onbs(1)},
onbs(n){n=+n;ONB.s=n;
if(n===1)sheet(onbHead(1)+`<h2>Uang Anda sekarang berapa?</h2><small class="hint">Jumlahkan uang yang bisa Anda pakai hari ini. Perkiraan juga boleh, nanti bisa diubah di tab Rekening.</small><label>Uang tunai (Rp)<input id="ob1" inputmode="numeric" placeholder="0" value="${ONB.cash}"></label><label>Saldo bank dan e-wallet (Rp)<input id="ob2" inputmode="numeric" placeholder="0" value="${ONB.bank}"></label><p id="err" class="neg"></p><div class="row"><button class="btn" data-a="onbnext">Lanjut</button><button class="btn ghost" data-a="close">Nanti saja</button></div>`);
else if(n===2)sheet(onbHead(2)+`<h2>Gajian tanggal berapa?</h2><small class="hint">Dipakai untuk menghitung berapa hari uang Anda harus cukup. Tidak punya gaji tetap? Pilih tanggal 1 (awal bulan). Gajian tanggal 29–31? Isi 28.</small><div class="row chips" role="group" aria-label="Pilihan cepat tanggal gajian">${[1,5,10,15,20,25,28].map(v=>`<button type="button" class="chip" data-a="onbpd:${v}">${v}</button>`).join('')}</div><label>Tanggal gajian (1–28)<input id="ob3" inputmode="numeric" data-plain maxlength="2" placeholder="25" value="${esc(ONB.pd)}"></label><p id="err" class="neg"></p><div class="row"><button class="btn" data-a="onbnext">Lanjut</button><button class="btn ghost" data-a="onbback">Kembali</button></div>`);
else sheet(onbHead(3)+`<h2>Tagihan tetap tiap bulan?</h2><small class="hint">Contoh: kos atau sewa, cicilan, listrik, internet. Finara menyisihkannya lebih dulu supaya tidak terpakai untuk jajan. Isi tanggal jatuh tempo bulanan. Bila tanggal bulan ini sudah lewat atau hari ini, Finara menganggap tagihan bulan ini sudah dibayar dan mulai menghitung bulan berikutnya. Tagihan yang belum dibayar perlu dicatat sebagai kewajiban terpisah. Boleh dikosongkan.</small><div class="row chips" role="group" aria-label="Contoh tagihan">${['Kos atau sewa','Cicilan','Listrik','Internet dan pulsa'].map(v=>`<button type="button" class="chip" data-a="onbbill:${v}">+ ${v}</button>`).join('')}</div><div id="bls">${(ONB.bills.length?ONB.bills:[{n:'',a:'',d:''}]).map(b=>brow(b.n,b.a,b.d)).join('')}</div><div class="row"><button class="btn ghost" data-a="onbrow">Tambah baris</button></div><p id="err" class="neg"></p><div class="row"><button class="btn" data-a="onbnext">Hitung jatah</button><button class="btn ghost" data-a="onbback">Kembali</button></div>`)},
onbpd(v){const e=$('#ob3');if(e)e.value=v},
onbrow(){const b=$('#bls');if(!b||b.children.length>=8)return;b.insertAdjacentHTML('beforeend',brow('','',''));fmtInit();b.lastElementChild.querySelector('.bnm').focus()},
onbrowdel(id){const e=document.getElementById('b'+id);if(e)e.remove()},
onbbill(n){const b=$('#bls');if(!b)return;let r=[...b.children].find(r=>!r.querySelector('.bnm').value.trim());if(!r){if(b.children.length>=8)return;act.onbrow();r=b.lastElementChild}r.querySelector('.bnm').value=n;r.querySelector('.ba').focus()},
onbback(){if(ONB.s===2)ONB.pd=($('#ob3').value||'').trim();if(ONB.s===3)ONB.bills=readBills();act.onbs(Math.max(1,ONB.s-1))},
onbnext(){const err=t=>{$('#err').textContent=t};
if(ONB.s===1){const c=NB($('#ob1').value.replace(/\D/g,'')),b=NB($('#ob2').value.replace(/\D/g,''));
if(c<0n||b<0n){err('Nominal terlalu besar.');return}if(c+b<=0n){err('Isi uang Anda sekarang. Perkiraan juga boleh.');return}
ONB.cash=c?String(c):'';ONB.bank=b?String(b):'';act.onbs(2)}
else if(ONB.s===2){const v=parseInt($('#ob3').value,10);if(!(v>=1&&v<=28)){err('Isi angka 1 sampai 28.');return}ONB.pd=String(v);act.onbs(3)}
else{const o=[];for(const r of readBills()){if(!r.n&&!r.a&&!r.d)continue;const a=NB(r.a),d=parseInt(r.d,10),n=r.n||'Tagihan';
if(a<0n){err('Nominal terlalu besar untuk "'+n+'".');return}if(a===0n){err('Isi nominal untuk "'+n+'".');return}if(!(d>=1&&d<=28)){err('Isi tanggal jatuh tempo 1 sampai 28 untuk "'+n+'".');return}o.push({n,a:String(a),d:String(d)})}
ONB.bills=o;act.onbdone()}},
// Terapkan jawaban: saldo awal, tanggal gajian, tagihan tetap. Hanya dipanggil saat belum ada uang tercatat.
onbdone(){S.active='p';const P=S.acc.filter(a=>a.w==='p');if(!P.length){const a={id:uid(),w:'p',name:'Tunai',open:0n};S.acc.push(a);P.push(a)}
const c=BigInt(ONB.cash||'0'),b=BigInt(ONB.bank||'0');if(P[1]){P[0].open=c;P[1].open=b}else P[0].open=c+b;
S.payday=+ONB.pd;const pa=P[1]&&b>c?P[1]:P[0];let n=0;for(const v of ONB.bills)if(addBill(v.n,BigInt(v.a),+v.d,pa.id))n++;
if(!S.profile)S.profile='person';logA('','jatah harian','saldo '+rp(c+b)+', gajian tanggal '+S.payday+', '+n+' tagihan');save();render();act.onbres()},
onbres(){const J=jatah(),ok=J.fr>0n;sheet(`<div class="stp"><i class="on"></i><i class="on"></i><i class="on"></i><small>Selesai</small></div><h2>${ok?'Jatah harian Anda':'Uang belum cukup sampai gajian'}</h2><div class="c res"><small>${ok?'Estimasi alokasi per hari':'Kekurangan'}</small><b class="big ${ok?'pos':'neg'}">${ok?rp(J.per):rp(-J.fr)}</b><small>${ok?'selama '+J.days+' hari, sampai gajian '+tglId(J.np):'setelah tagihan, tabungan, dan cadangan sampai '+tglId(J.np)}</small></div>
<div class="c"><table><tr><td>Uang Anda sekarang</td><td>${rp(J.tot)}</td></tr><tr><td>Tagihan sebelum gajian<small>${J.B.length} tagihan</small></td><td>−${rp(J.bt)}</td></tr><tr><td>Tabungan yang diamankan</td><td>−${rp(J.savingsHold)}</td></tr><tr><td>Cadangan tak terduga</td><td>−${rp(J.reserve)}</td></tr><tr><td>Uang tersedia</td><td>${rp(J.fr)}</td></tr><tr><td>Dibagi jumlah hari</td><td>${J.days} hari</td></tr></table></div>${ok?'':'<small class="hint">Coba tunda pengeluaran yang tidak wajib, atau periksa saldo, tagihan, target tabungan, dan cadangan. Saldo ada di tab Rekening, tagihan di Lainnya › Tagihan tetap dan transaksi berulang.</small>'}<h3>Cara memakainya</h3><p>Ini estimasi setelah tagihan, tabungan, dan cadangan, bukan jaminan uang aman dibelanjakan. Pastikan total saldo mencakup seluruh rekening termasuk tabungan dan cadangan. Atur target tabungan serta cadangan melalui Ubah tanggal gajian di Beranda. Setiap kali Anda belanja, ketuk Catat. Beranda langsung menunjukkan sisa jatah hari ini, dan sebelum menyimpan Anda sudah melihat dampaknya.</p><div class="row"><button class="btn" data-a="onbgo">Catat pengeluaran</button><button class="btn ghost" data-a="close">Lihat Beranda</button></div>`)},
onbgo(){act.add('expense')},
billnew(){sheet(`<h2>Tambah tagihan tetap</h2><small class="hint">Tagihan yang muncul tiap bulan, misalnya kos, cicilan, listrik, atau internet. Finara menyisihkannya dari total saldo sebelum menghitung jatah harian, dan mencatatnya otomatis pada tanggalnya.</small><label>Nama tagihan<input id="bln" maxlength="40" placeholder="Contoh: Kos"></label><label>Nominal (Rp)<input id="bla" inputmode="numeric" placeholder="0"></label><label>Tanggal jatuh tempo tiap bulan (1–28)<input id="bld" inputmode="numeric" data-plain maxlength="2" placeholder="5"></label><label>Dibayar dari rekening<select id="blk">${accs().map(a=>opt(a.id,a.name,LAST.a)).join('')}</select></label><p id="err" class="neg"></p><div class="row"><button class="btn" data-a="billsave">Simpan tagihan</button><button class="btn ghost" data-a="close">Batal</button></div>`)},
billsave(){const n=$('#bln').value.trim(),a=NB($('#bla').value.replace(/\D/g,'')),d=parseInt($('#bld').value,10),k=$('#blk').value;

const f0=jatah().fr;addBill(n,a,d,k);save();render();const f1=jatah().fr;act.rec();
toast(f1!==f0?'Tagihan disimpan. Sisa setelah tagihan sampai gajian: '+rp(f0)+' → '+rp(f1):'Tagihan disimpan. Dihitung ke jatah saat jatuh temponya masuk periode gajian ini.',4800)},
lanjut(){LANJUT=!LANJUT;try{localStorage.setItem('finara.lanjut',LANJUT?'1':'0')}catch(e){}render();toast(LANJUT?'Fitur lanjutan ditampilkan':'Fitur lanjutan disembunyikan')}
});

<script>
/* ============================================================

   Dimuat berurutan (angka di nama berkas = urutan). Semua berkas

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const i=b.dataset.a.indexOf(':'),a=i<0?b.dataset.a:b.dataset.a.slice(0,i);act[a]&&act[a](i<0?'':b.dataset.a.slice(i+1))});
document.addEventListener('click',e=>{const h=e.target.closest('.hint');if(!h)return;h.classList.toggle('fold');const k=hash(h.textContent),i=FOLD.indexOf(k);if(h.classList.contains('fold')){if(i<0)FOLD.push(k)}else if(i>=0)FOLD.splice(i,1);try{localStorage.setItem('bukukas.fold',JSON.stringify(FOLD))}catch(x){}});
let SWX=0,SWE=null,SWD=0,SWQ=0;
document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('.tx[data-sw]');if(t){SWE=t;SWX=e.clientX;SWD=0}});
document.addEventListener('pointermove',e=>{if(!SWE)return;const d=e.clientX-SWX;if(d<-10||SWD){SWD=Math.max(-160,Math.min(0,d));SWE.classList.add('sw');SWE.style.transform='translateX('+SWD+'px)'}});
const swEnd=e=>{if(!SWE)return;const t=SWE,d=SWD;SWE=null;SWD=0;if(!d)return;SWQ=Date.now();if(d<-90&&e.type==='pointerup'){act.voidq(t.dataset.sw);return}t.style.transform='';t.classList.remove('sw')};
document.addEventListener('pointerup',swEnd);document.addEventListener('pointercancel',swEnd);
document.addEventListener('click',e=>{if(Date.now()-SWQ<400){e.stopImmediatePropagation();e.preventDefault()}},true);
$('#sh').addEventListener('click',e=>{if(e.target.id==='sh')close()});
function tb(n){n=BigInt(n);if(n===0n)return'Nol rupiah';
const w=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'],
sc=['','ribu','juta','miliar','triliun','kuadriliun','kuintiliun','sekstiliun','septiliun','oktiliun','noniliun','desiliun'];
const f=g=>g<12?w[g]:g<20?w[g-10]+' belas':g<100?w[Math.floor(g/10)]+' puluh'+(g%10?' '+w[g%10]:''):g<200?'seratus'+(g>100?' '+f(g-100):''):w[Math.floor(g/100)]+' ratus'+(g%100?' '+f(g%100):'');
const d=n.toString(),gs=[];for(let e=d.length;e>0;e-=3)gs.unshift(d.slice(Math.max(0,e-3),e));
const out=[];gs.forEach((x,k)=>{const g=Number(x),i=gs.length-1-k;if(!g)return;out.push(i===1&&g===1?'seribu':f(g)+(sc[i]?' '+sc[i]:''))});
const t=out.join(' ');return t[0].toUpperCase()+t.slice(1)+' rupiah'}
function fmtNum(el){const pos=el.selectionStart,d=(el.value.slice(0,pos).match(/\d/g)||[]).length,g=el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,MAXD+1),v=g.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
el.value=v;if(document.activeElement===el){let i=0,c=0;while(i<v.length&&c<d){if(/\d/.test(v[i]))c++;i++}try{el.setSelectionRange(i,i)}catch(e){}}
const o=el.nextElementSibling;if(o&&o.classList.contains('say'))o.textContent=!g?'':g.length>MAXD?'Nominal terlalu besar':tb(BigInt(g))}
function fmtInit(){document.querySelectorAll('#shc input[inputmode="numeric"]:not([data-plain])').forEach(el=>{if(!el.nextElementSibling||!el.nextElementSibling.classList.contains('say'))el.insertAdjacentHTML('afterend','<small class="say" aria-live="polite"></small>');fmtNum(el)})}
function srcsum(){const r=[...document.querySelectorAll('#shc .sa')],o=$('#ao');if(!o)return;o.readOnly=r.length>0;if(!r.length)return;const t=r.reduce((t,e)=>t+BigInt(e.value.replace(/\D/g,'').slice(0,MAXD+1)||'0'),0n);o.value=t?String(t):'';fmtNum(o)}
document.addEventListener('input',e=>{const el=e.target;if(el.matches&&el.matches('#shc input[inputmode="numeric"]:not([data-plain])'))fmtNum(el);if(el.classList&&el.classList.contains('sa'))srcsum()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sh').classList.contains('on'))close()});
function fit(el,max){el.style.fontSize='';el.style.whiteSpace='';el.style.wordBreak='';if(!(max>0)||!el.getClientRects().length)return;let fs=parseFloat(getComputedStyle(el).fontSize);while(fs>9&&el.scrollWidth>max+.5){fs-=Math.max(.5,fs*.04);el.style.fontSize=fs+'px'}if(el.scrollWidth>max+.5){el.style.whiteSpace='normal';el.style.wordBreak='break-all'}}
function fitAll(){document.querySelectorAll('.hero b,.hmini strong,.g2 b,.cards b,.big').forEach(e=>fit(e,e.clientWidth));
document.querySelectorAll('.tx>span:last-child').forEach(e=>fit(e,e.parentElement.clientWidth*.8));
document.querySelectorAll('td+td').forEach(e=>{const t=e.closest('table'),pe=t.parentElement,ps=getComputedStyle(pe),iw=pe.clientWidth-parseFloat(ps.paddingLeft)-parseFloat(ps.paddingRight);fit(e,Math.min(t.clientWidth,iw)*(t.rows[0].cells.length>2?.34:.55))});
document.querySelectorAll('.rep-b b').forEach(e=>fit(e,e.parentElement.clientWidth*.6))}
let fq;const sched=()=>{cancelAnimationFrame(fq);fq=requestAnimationFrame(fitAll)};
new MutationObserver(sched).observe(document.body,{childList:true,subtree:true});
addEventListener('resize',sched);addEventListener('orientationchange',sched);if(document.fonts)document.fonts.ready.then(sched);

</script>

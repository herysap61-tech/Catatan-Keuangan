help(){sheet(`<h2>Petunjuk penggunaan</h2><h3>Agar data selalu tersimpan</h3><p>Data disimpan di peramban perangkat ini, bukan di server. Buka selalu lewat tautan dan peramban yang sama, jangan pakai tab penyamaran (incognito/private), dan jangan hapus data situs atau riwayat peramban.</p><h3>Android (Chrome)</h3><p>Ketuk menu ⋮, pilih Tambahkan ke layar utama (atau Instal aplikasi), lalu buka Finara dari ikon tersebut.</p><h3>iPhone (Safari)</h3><p>Buka tautan di Safari, ketuk Bagikan, pilih Tambah ke Layar Utama, lalu pakai dari ikon itu sejak awal. Data di tab Safari tidak otomatis ada di ikon, dan data situs yang lama tidak dibuka bisa dihapus iOS.</p><h3>Cadangan rutin</h3><p>Buka Lainnya, Cadangan dan pulihkan, ketuk Salin, lalu tempel ke tempat aman di luar aplikasi (Catatan atau email ke diri sendiri). Lakukan seminggu sekali. Cadangan tidak dienkripsi, jadi simpan di tempat yang hanya Anda yang bisa buka.</p><h3>Memulihkan data</h3><p>Buka Cadangan dan pulihkan, tempel teks cadangan di kolom Pulihkan, lalu ketuk Periksa dan pulihkan.</p><h3>Mengisi saldo awal</h3><p>Buka tab Rekening, ketuk rekening yang ada (Tunai, Bank, dst.), lalu ketuk Ubah nama dan saldo awal. Isi jumlah uang yang sudah ada sebelum Anda mulai mencatat. Untuk rekening baru, pakai Tambah rekening.</p><h3>Tips mencatat</h3><p>Ketuk + untuk mencatat. Pindah dana antar rekening pakai Transfer, bukan pengeluaran. Modal dan pinjaman dicatat dengan jenisnya sendiri agar tidak dihitung sebagai pendapatan. Transaksi yang salah bisa dibatalkan dan tetap tercatat sebagai batal.</p><h3>Tombol Bantuan</h3><p>Tombol ? (di kanan atas, dan di pojok kanan atas setiap jendela form) menampilkan atau menyembunyikan semua catatan penjelasan. Ketuk satu catatan untuk melipatnya jadi satu baris, ketuk lagi untuk membukanya. Pilihan tombol dan catatan yang dilipat diingat di perangkat Anda.</p><h3>Prinsip aplikasi</h3><p>Saldo tidak disimpan sebagai satu angka. Ia dihitung ulang dari saldo awal ditambah semua transaksi sah, jadi selalu bisa diperiksa. Pencatatan memakai basis kas: pendapatan dan beban dihitung saat uang bergerak. Transaksi batal tidak dihapus, hanya tidak dihitung. Ruang kerja Pribadi dan Usaha terpisah penuh. Laporan memakai tanggal transaksi. Bagi yang paham akuntansi, setiap transaksi dibentuk menjadi jurnal debit-kredit yang bisa dilihat di Lainnya, Debit-kredit dan neraca.</p><div class="row"><button class="btn" data-a="close">Tutup</button></div>`)},
rec(){const a=S.rec.filter(r=>r.w===S.active),F={week:'mingguan',month:'bulanan',year:'tahunan'};sheet('<h2>Transaksi berulang</h2>'+(a.length?a.map(r=>`<div class="c"><b>${esc(T[r.tpl.ty].l)} ${rp(r.tpl.amt)}</b><small>${F[r.freq]} · berikutnya ${fd(r.next)} · ${esc(nm(S.acc,r.tpl.a))}${r.on?'':' · dijeda'}</small><div class="row"><button class="btn ghost" data-a="rtog:${r.id}">${r.on?'Jeda':'Aktifkan'}</button><button class="btn ghost" data-a="rdel:${r.id}">Hapus aturan</button></div></div>`).join(''):'<div class="empty">Belum ada. Saat mencatat transaksi baru, pilih Ulangi.</div>')+'<div class="row"><button class="btn ghost" data-a="close">Tutup</button></div><small>Transaksi dicatat otomatis saat aplikasi dibuka, termasuk yang terlewat.</small>')},

plist(){const a=S.pay.filter(p=>p.w===S.active&&p.st!=='void').sort((x,y)=>x.due.localeCompare(y.due)),sm=d=>a.filter(p=>p.dir===d).reduce((s,p)=>s+sisa(p),0n);
sheet(`<h2>Utang-piutang</h2><div class="c g2"><div><small>Piutang (hak tagih)</small><b class="pos">${rp(sm('recv'))}</b></div><div><small>Utang (kewajiban)</small><b class="neg">${rp(sm('pay'))}</b></div></div>`+(a.length?a.map(p=>{const r=sisa(p);return`<button class="tx" data-a="pdet:${p.id}"><i class="av ${p.dir==='recv'?'pos':'neg'}">${p.dir==='recv'?'↓':'↑'}</i><span class="gr">${esc(p.who)}<small>Jatuh tempo ${fd(p.due)}${r>0n&&p.due<today()?' · terlambat':''}${r===0n?' · lunas':''}</small></span><span>${rp(r)}</span></button>`}).join(''):'<div class="empty">Belum ada catatan.</div>')+'<div class="row"><button class="btn" data-a="pnew">Tambah</button><button class="btn ghost" data-a="close">Tutup</button></div><small>Pembayaran bisa langsung dicatat ke rekening: piutang menjadi pendapatan, utang menjadi pengeluaran. Untuk pinjaman uang, pilih Tanpa transaksi rekening lalu catat dengan jenis Pinjaman diterima atau Bayar pokok pinjaman.</small>')},
pnew(){sheet(`<h2>Catatan baru</h2><label>Jenis<select id="pd"><option value="recv">Piutang (orang lain berutang ke saya)</option><option value="pay">Utang (saya berutang)</option></select></label><label>Nama pihak<input id="pw" maxlength="60"></label><label>Nominal (Rp)<input id="pa" inputmode="numeric"></label><label>Jatuh tempo<input type="date" id="pu" value="${today()}"></label><label>Catatan<input id="pn" maxlength="120"></label><p id="err" class="neg"></p><div class="row"><button class="btn" data-a="psave">Simpan</button><button class="btn ghost" data-a="plist">Kembali</button></div>`)},
psave(){const w=$('#pw').value.trim(),ds=$('#pa').value.replace(/\D/g,''),amt=NB(ds),u=$('#pu').value;const m=!w?'Isi nama pihak.':amt<0n?'Nominal terlalu besar.':!amt?'Nominal harus lebih dari 0.':!/^\d{4}-\d{2}-\d{2}$/.test(u)||ymd(new Date(u+'T00:00:00'))!==u?'Tanggal jatuh tempo tidak valid.':'';if(m){$('#err').textContent=m;return}
const p={id:uid(),w:S.active,dir:$('#pd').value,who:w,amt,due:u,n:$('#pn').value.trim(),paid:[],st:'ok',at:Date.now()};S.pay.push(p);logA(p.id,'buat',(p.dir==='recv'?'Piutang ':'Utang ')+rp(amt)+' '+w);save();act.plist();render()},
pdet(p){const x=S.pay.find(v=>v.id===p);FM.p=p;const r=sisa(x);sheet(`<h2>${esc(x.who)}</h2><small>${x.dir==='recv'?'Piutang':'Utang'} · jatuh tempo ${fd(x.due)}${x.n?' · '+esc(x.n):''}</small><div class="c"><table><tr><td>Total</td><td>${rp(x.amt)}</td></tr>${x.paid.map(v=>`<tr><td>Dibayar ${fd(v.d)}${v.tx?' · ke rekening':''}${v.tx&&!pa(v)?' · batal':''}</td><td>${rp(pa(v))}</td></tr>`).join('')}<tr><td><b>Sisa</b></td><td>${rp(r)}</td></tr></table></div>${r>0n?`<label>Catat pembayaran (Rp)<input id="pp" inputmode="numeric" value="${r}"></label><label>Catat ke rekening<select id="pac"><option value="">Tanpa transaksi rekening</option>${accs().map(a=>opt(a.id,a.name,accs()[0].id)).join('')}</select></label><label>Kategori<select id="pcat">${cats(x.dir==='recv'?'in':'out').map(c=>opt(c.id,c.name)).join('')}</select></label><small class="hint">${x.dir==='recv'?'Uang masuk ke rekening dan dicatat sebagai pendapatan.':'Uang keluar dari rekening dan dicatat sebagai pengeluaran.'} Pilih Tanpa transaksi rekening jika uangnya sudah Anda catat sendiri atau berupa pinjaman uang.</small><p id="err" class="neg"></p><div class="row"><button class="btn" data-a="ppay">Catat pembayaran</button>`:'<div class="row">'}<button class="btn ghost" data-a="pvoid">Batalkan catatan</button><button class="btn ghost" data-a="plist">Kembali</button></div>`)},
ppay(){const x=S.pay.find(v=>v.id===FM.p),ds=$('#pp').value.replace(/\D/g,''),a=NB(ds);if(a<=0n||a>sisa(x)){$('#err').textContent='Nominal harus lebih dari 0 dan tidak melebihi sisa.';return}const ac=$('#pac').value,ct=$('#pcat').value;if(ac&&!ct){$('#err').textContent='Pilih kategori.';return}const pm={d:today(),amt:a};if(ac){const t={id:uid(),w:S.active,st:'ok',at:Date.now(),d:today(),ty:x.dir==='recv'?'income':'expense',a:ac,to:'',c:ct,amt:a,n:(x.dir==='recv'?'Terima piutang ':'Bayar utang ')+x.who,pay:x.id};S.tx.push(t);logA(t.id,'buat',desc(t));pm.tx=t.id}x.paid.push(pm);logA(x.id,'bayar',rp(a));save();act.pdet(x.id);render()},
pvoid(){ask('Batalkan catatan ini? Transaksi rekening yang dibuat dari pembayarannya ikut dibatalkan.','pvoid2')},
pvoid2(){const x=S.pay.find(v=>v.id===FM.p);x.st='void';for(const v of x.paid){const t=v.tx&&S.tx.find(q=>q.id===v.tx);if(t&&t.st==='ok'){t.st='void';logA(t.id,'batal',desc(t))}}logA(x.id,'batal',x.who);save();act.plist();render()},
jurnal(){const L=ledger(),k=Object.keys(L).sort(),net=a=>L[a][0]-L[a][1],g=p=>k.filter(a=>a[0]===p).reduce((s,a)=>s+net(a),0n);let D=0n,C=0n;
const rows=k.map(a=>{const n=net(a),d=n>0n?n:0n,c=n<0n?-n:0n;D+=d;C+=c;return`<tr><td>${esc(lname(a))}</td><td>${d?rp(d):''}</td><td>${c?rp(c):''}</td></tr>`}).join(''),as=g('A'),li=-g('L'),eq=-(g('E')+g('R')+g('B')),ok=D===C&&as===li+eq;
sheet(`<h2>Debit-kredit dan neraca</h2><small class="hint">Setiap transaksi punya dua sisi, debit dan kredit, dengan nilai sama. Aset seperti rekening normalnya di debit, sedangkan pendapatan, modal, dan kewajiban normalnya di kredit. Jurnal dibentuk otomatis dari saldo awal dan setiap transaksi sah.</small><div class="c"><table><tr><td><b>Akun</b></td><td><b>Debit</b></td><td><b>Kredit</b></td></tr>${rows}<tr><td><b>Total</b></td><td>${rp(D)}</td><td>${rp(C)}</td></tr></table><p class="${ok?'pos':'neg'}">${ok?'Seimbang: total debit sama dengan total kredit.':'Tidak seimbang. Periksa data atau buat cadangan.'}</p></div><h3>Neraca ringkas</h3><div class="c"><table><tr><td>Aset (rekening)</td><td>${rp(as)}</td></tr><tr><td>Kewajiban (pinjaman)</td><td>${rp(li)}</td></tr><tr><td>Ekuitas</td><td>${rp(eq)}</td></tr></table></div><div class="row"><button class="btn ghost" data-a="close">Tutup</button></div>`)},
log(){const a=S.log.slice(-60).reverse();sheet('<h2>Riwayat perubahan</h2>'+(a.length?'<div class="lst">'+a.map(v=>`<div class="tx"><span class="gr">${esc(v.act)}<small>${new Date(v.t).toLocaleString('id-ID')} · ${esc(v.b)}</small></span></div>`).join('')+'</div>':'<div class="empty">Belum ada riwayat.</div>')+'<div class="row"><button class="btn ghost" data-a="close">Tutup</button></div>')},
info(){sheet(`<h2>Tentang dan keterbatasan</h2><p><b>Finara</b> v${VER} · Made by <b>Herysap61</b></p><p>Data tersimpan di peramban perangkat ini dan berjalan tanpa internet. Agar bisa dibuka saat offline, buka sekali lewat tautan web (https) bersama file sw.js; setelah itu salinan aplikasi tersimpan di perangkat. Jika file HTML dibuka langsung dari penyimpanan, fitur offline ini tidak aktif. Di iPhone, tambahkan ke Layar Utama agar penyimpanan lebih awet; buat cadangan rutin.</p><p>Belum tersedia: kunci PIN/biometrik, enkripsi cadangan, dan notifikasi pengingat. Transaksi berulang dicatat otomatis saat aplikasi dibuka, jurnal debit-kredit dibentuk otomatis dari transaksi, dan data lama dimigrasi otomatis ke skema terbaru. Saldo dihitung ulang dari saldo awal dan transaksi sah setiap kali ditampilkan. Nominal memakai bilangan bulat presisi penuh hingga 36 digit (sampai 999 desiliun), sehingga tidak ada pembulatan.</p><div class="row"><button class="btn" data-a="close">Tutup</button></div>`)}};

function tb(n){n=BigInt(n);if(n===0n)return'Nol rupiah';
const w=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'],
sc=['','ribu','juta','miliar','triliun','kuadriliun','kuintiliun','sekstiliun','septiliun','oktiliun','noniliun','desiliun'];
const f=g=>g<12?w[g]:g<20?w[g-10]+' belas':g<100?w[Math.floor(g/10)]+' puluh'+(g%10?' '+w[g%10]:''):g<200?'seratus'+(g>100?' '+f(g-100):''):w[Math.floor(g/100)]+' ratus'+(g%100?' '+f(g%100):'');
const d=n.toString(),gs=[];for(let e=d.length;e>0;e-=3)gs.unshift(d.slice(Math.max(0,e-3),e));
const out=[];gs.forEach((x,k)=>{const g=Number(x),i=gs.length-1-k;if(!g)return;out.push(i===1&&g===1?'seribu':f(g)+(sc[i]?' '+sc[i]:''))});
const t=out.join(' ');return t[0].toUpperCase()+t.slice(1)+' rupiah'}
function fmtNum(el){const pos=el.selectionStart,d=(el.value.slice(0,pos).match(/\d/g)||[]).length,g=el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,MAXD+1),v=g.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
el.value=v;if(document.activeElement===el){let i=0,c=0;while(i<v.length&&c<d){if(/\d/.test(v[i]))c++;i++}try{el.setSelectionRange(i,i)}catch(e){}}
const o=el.nextElementSibling;if(o&&o.classList.contains('say'))o.textContent=!g?'':g.length>MAXD?'Nominal terlalu besar':tb(BigInt(g))}
